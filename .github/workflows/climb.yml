name: Generate GitClimb Wall

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/climb.yml"
      - "scripts/gitclimb.py"
      - "scripts/publish-wall.sh"

permissions:
  contents: write

concurrency:
  group: gitclimb-wall
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test route and calendar handling
        run: python -m unittest discover -s tests -v
      - name: Generate live contribution wall
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gitclimb.py --username Innoffline --output dist
      - name: Publish to output branch
        run: bash scripts/publish-wall.sh
